name: release

# A SemVer tag such as v0.1.0 builds the release archives and publishes them
# with their SHA256SUMS as the GitHub release of that tag (0042).
#
# release-please creates the tag and a draft release with the changelog as its
# notes when its release pull request is merged, and runs this workflow on
# that tag with workflow_dispatch: a tag created with GITHUB_TOKEN starts no
# push event (0052). This workflow then uploads the archives to that draft and
# publishes it. A tag pushed by a person still starts it, and then there is no
# draft: the workflow creates the release itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The exact toolchain of the release binaries, which `dotai version` and
  # the release notes report.
  GO_VERSION: "1.26.10"

jobs:
  # A manual run takes a ref, and only a tag is a release.
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: ref is a tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::$REF is not a v* tag; run this workflow from the tag to release"
              exit 1
              ;;
          esac

  test:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and origin/main, for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - name: tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points to $commit, which is not on main; only commits merged into main are released"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh "$TAG" dist
      # Attestations for a private repository need a paid plan; the release
      # of a private repository ships without them.
      - name: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The release stays a draft until every file is uploaded. The draft that
      # release-please created for this tag is completed: its notes, the
      # changelog, are kept, with the toolchain line in front. A rerun of the
      # same tag completes its draft again, with this run's title, pre-release
      # flag and files; a published release is never changed. With no release
      # (a tag pushed by a person) the run creates the draft with notes from
      # GitHub.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          built="Built with $(go version | cut -d' ' -f3) by \`scripts/release.sh\`."
          generated() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          }
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')
          case "$drafts" in
            "")
              notes="$built"$'\n\n'$(generated)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                --title "dotai $TAG" --notes "$notes" --prerelease="$prerelease"
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
              ;;
            true)
              echo "completing the existing draft of $TAG"
              # The notes of the draft, without the line an earlier run put in
              # front of them.
              body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
              body=${body#"$built"}
              body=${body#$'\n\n'}
              if [ -z "$body" ]; then
                body=$(generated)
              fi
              notes="$built"$'\n\n'"$body"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "dotai $TAG" --notes "$notes" --prerelease="$prerelease"
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              # A file the draft holds that this run did not build is removed.
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                while IFS= read -r asset; do
                  [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                done
              ;;
            *false*)
              echo "::error::a published release of $TAG already exists; it is not changed. Delete it or release a new tag."
              exit 1
              ;;
            *)
              echo "::error::$TAG has several draft releases; delete all but one and rerun"
              exit 1
              ;;
          esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
