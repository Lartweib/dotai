name: release-please

# Keeps one release pull request open on main: it proposes the next version from the conventional
# commits since the last release and writes CHANGELOG.md. Merging that pull request is how the
# owner decides to release: this workflow then creates the v* tag and a draft GitHub Release with
# the changelog as its notes, and starts release.yml on the tag, which builds the archives and
# publishes the draft (0052). Config: release-please-config.json and
# .release-please-manifest.json. See CONTRIBUTING.md > Releasing.
#
# This uses the run's GITHUB_TOKEN, so no secret is needed. Anything it creates with that token (the
# release pull request, the tag) does not start other workflows by itself, which GitHub does on
# purpose to avoid loops, except a workflow_dispatch:
#
# - A release creates its tag with no `push: tags` event: the tag is dispatched to release.yml
#   with `gh workflow run --ref <tag>`. Because the tag push never fires, a release runs it once.
# - The release pull request does get its pull_request runs (ci.yml, commits.yml), held for
#   approval because a bot opened it: the owner clicks "Approve and run workflows" on the pull
#   request. Checks from a workflow_dispatch run on its branch do not count for the ruleset's
#   required checks, so none is dispatched (seen on the first release pull request, #80).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The tag, the release, the release branch and CHANGELOG.md.
      contents: write
      # The release pull request and its labels.
      pull-requests: write
      issues: write
      # `gh workflow run`.
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Start the release workflow on the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "Started release.yml on $TAG" >> "$GITHUB_STEP_SUMMARY"
