name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest patch of the go.mod minor, so govulncheck sees a patched standard library.
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: verify modules
        if: runner.os == 'Linux'
        run: go mod verify
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      # The race detector needs cgo and a C toolchain on Windows.
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: build
        run: go build ./cmd/dotai
