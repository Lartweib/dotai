name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these tests before it builds.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run; runs on main and
# the release's call of this workflow are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the go.mod minor, so govulncheck sees a patched standard library.
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: verify modules
        if: runner.os == 'Linux'
        run: go mod verify
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: staticcheck
        if: runner.os == 'Linux'
        # Built for the runner, then run for each OS the engine has code for.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for goos in linux windows darwin; do
            echo "staticcheck GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./...
          done
      - name: release tag pattern
        if: runner.os == 'Linux'
        run: bash scripts/release.sh --self-test
      # Every module linked into a release binary must ship a license file.
      - name: third-party notices
        if: runner.os == 'Linux'
        run: bash scripts/release.sh --check-notices
      # shellcheck comes with the Ubuntu runner image.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/release.sh
      - name: vet
        run: go vet ./...
      # Runs the tests of the web UI's pure modules (internal/server/webtest).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      # The race detector needs cgo and a C toolchain on Windows.
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      # Runs the install scripts again, verbose, so that the log shows the
      # shells each case ran under (sh and bash, or powershell and pwsh).
      - name: install scripts
        run: go test -count=1 -v -run TestInstallScripts ./cmd/dotai | grep -E '^ *--- |^(ok|FAIL|PASS)'
      - name: build
        run: go build ./cmd/dotai
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rulesync-cache
          key: rulesync-${{ runner.os }}-${{ hashFiles('internal/rulesync/rulesync.go') }}
      # Stages the example pack with the real pinned rulesync binary.
      - name: test with real rulesync
        env:
          DOTAI_E2E: "1"
          DOTAI_CACHE_DIR: ${{ runner.temp }}/rulesync-cache
        run: go test -count=1 -run TestStageWithRealRulesync ./internal/app/
