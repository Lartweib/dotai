name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these tests before it builds.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Latest patch of the go.mod minor, so govulncheck sees a patched standard library.
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: verify modules
        if: runner.os == 'Linux'
        run: go mod verify
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: release tag pattern
        if: runner.os == 'Linux'
        run: bash scripts/release.sh --self-test
      - name: vet
        run: go vet ./...
      # Runs the tests of the web UI's pure modules (internal/server/webtest).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      # The race detector needs cgo and a C toolchain on Windows.
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: build
        run: go build ./cmd/dotai
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rulesync-cache
          key: rulesync-${{ runner.os }}-${{ hashFiles('internal/rulesync/rulesync.go') }}
      # Stages the example pack with the real pinned rulesync binary.
      - name: test with real rulesync
        env:
          DOTAI_E2E: "1"
          DOTAI_CACHE_DIR: ${{ runner.temp }}/rulesync-cache
        run: go test -count=1 -run TestStageWithRealRulesync ./internal/app/
