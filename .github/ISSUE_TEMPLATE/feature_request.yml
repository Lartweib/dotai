name: Feature request
description: Suggest a change or a new capability for dotai.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like dotai to do. Name the commands, pack files or harnesses it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including in a pack instead of the engine.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related decision records (docs/decisions), roadmap items or harness notes.
