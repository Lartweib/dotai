# The manifest of the pack (docs/PACK-FORMAT.md, "Manifest").
schema: dotai.pack/v1
name: example-pack
version: 0.1.0
engine: ">=0.1.0"
rulesync: 43.12.0
# The harnesses the pack is compatible with, by their rulesync target
# names: an install manages those that are installed, and the user may
# pick fewer. A preview harness, such as opencode, is managed only when
# the user chooses it, or the previous install of the pack managed it.
harnesses: [claudecode, antigravity-cli, opencode]
# The harnesses of harnesses the pack cannot do without: an install
# stops when one is not installed. Empty, the pack needs none.
requires: []

# Profiles are project scope: dotai apply --profile installs them in a
# repository. The description and the hints are all dotai's onboarding
# skill knows about a profile, so write them for a reader who has not
# seen the pack.
profiles:
  example:
    path: profiles/example
    description: "An example profile, to replace with one for a kind of project, such as web apps."
    hints: [package.json]
    mods: [example-mod]

# Variants are user scope, with the base: dotai install takes the default
# one unless --variant names another.
variants:
  default:
    path: variants/default
    default: true
